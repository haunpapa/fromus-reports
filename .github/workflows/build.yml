# ───────────────────────────────────────────────────────────────
#  Build & Deploy (GitHub Pages — Actions artifact 배포)
#  생성물(index.html/hub.html/knowledge_base.json 등)은 더 이상 커밋하지 않는다.
#  Pages 소스가 "GitHub Actions"로 설정되어 있어야 한다 (README/PR 참고).
# ───────────────────────────────────────────────────────────────
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'chat_kb.json'
      - 'build_index.py'
      - 'build_hub.py'
      - 'ai_digest.py'
      - 'merge_hub.py'
      - 'hub_template.html'
      - 'sw.js'
      - 'hublib/**'
      - 'hub/**'
      - 'vendor/**'
      - 'tests/e2e/**'
  schedule:
    - cron: '30 22 * * *'   # 매일 07:30 KST — 시세·trade·다이제스트 자동 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install beautifulsoup4 lxml yfinance

      - name: Sync 수출입동향 대시보드 (실패 시 리포 내 기존 trade.html 사용)
        run: |
          curl -fsSL -o trade.new.html https://raw.githubusercontent.com/haunpapa/korea-trade-dashboard/main/korea-trade-sector-dashboard.html \
            && tail -c 30 trade.new.html | grep -q '</html>' \
            && mv trade.new.html trade.html \
            || { echo "동기화 실패 — 기존 trade.html 유지"; rm -f trade.new.html; }

      - name: Restore parse cache
        uses: actions/cache@v4
        with:
          path: build/parse_cache.json
          key: parse-cache-${{ hashFiles('reports/**/*.html', 'hublib/parse.py') }}
          restore-keys: parse-cache-

      # 가격은 매일 자라므로 내용 해시를 키로 쓸 수 없다 —
      # 매 실행마다 새로 저장하고 가장 최근 것을 복원한다. v1 은 CACHE_VERSION 과 함께 올린다.
      - name: Restore price cache (검증 레이어)
        uses: actions/cache@v4
        with:
          path: build/price_cache.json
          key: price-cache-v1-${{ github.run_id }}
          restore-keys: price-cache-v1-

      # what's new 는 '전일 빌드의 요약'과 비교한다 — 가격 캐시와 같은 이유로 run_id 키 + 최근 복원.
      - name: Restore kb summary (what's new 전일 기준)
        uses: actions/cache@v4
        with:
          path: build/kb_summary.json
          key: kb-summary-${{ github.run_id }}
          restore-keys: kb-summary-

      - name: Build index
        run: python build_index.py

      - name: Collect (파싱·집계·시세 — 1회만)
        run: python build_hub.py --phase collect --src . --json knowledge_base.json

      # 같은 입력은 다시 묻지 않는다 — 캐시가 없으면 그날 전량 재요약(비용만 늘고 결과는 같다).
      - name: Restore AI cache (증분 요약)
        uses: actions/cache@v4
        with:
          path: build/ai_cache.json
          key: ai-cache-v1-${{ github.run_id }}
          restore-keys: ai-cache-v1-

      - name: AI weekly digest (시크릿 없으면 자동 생략)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_digest.py || echo "AI 다이제스트 생략(실패 무시)"

      - name: Render (hub.html + kb.<hash>.json)
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}   # 리포 Variables 에 Pages URL — 없으면 feed.json 이 상대 URL
        run: python build_hub.py --phase render --json knowledge_base.json --out hub.html

      - name: Run tests
        run: pip install pytest && python -m pytest tests/ generator/test_parse.py -q

      - name: kb 크기 예산 (경고만, 코어 2배 초과 시 실패)
        run: KB_BUDGET_CHECK=1 python -m pytest tests/test_budget.py -q

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html hub.html knowledge_base.json trade.html manifest.webmanifest sw.js _site/
          cp ai_digest.json _site/ 2>/dev/null || true
          cp feed.json _site/ 2>/dev/null || true
          cp kb.*.json _site/ 2>/dev/null || true   # 데이터/셸 분리 이후 생성됨
          cp version.json _site/
          cp -r reports icons vendor _site/

      - name: E2E 스모크 (셸 JS — _site 기준)
        run: |
          pip install pytest-playwright && python -m playwright install --with-deps chromium
          E2E_SITE_DIR=_site python -m pytest tests/e2e -q

      - name: Job Summary (kb 크기·예산·E2E 타이밍)
        if: always()
        run: |
          cat build/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ -f build/e2e_timing.json ] && { echo; echo '### E2E 타이밍'; echo '```'; cat build/e2e_timing.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
