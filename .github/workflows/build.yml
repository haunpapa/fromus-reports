# ───────────────────────────────────────────────────────────────
#  Build & Deploy (GitHub Pages — Actions artifact 배포)
#  생성물(index.html/hub.html/knowledge_base.json 등)은 더 이상 커밋하지 않는다.
#  Pages 소스가 "GitHub Actions"로 설정되어 있어야 한다 (README/PR 참고).
# ───────────────────────────────────────────────────────────────
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'chat_kb.json'
      - 'build_index.py'
      - 'build_hub.py'
      - 'ai_digest.py'
      - 'merge_hub.py'
      - 'hub_template.html'
      - 'sw.js'
      - 'hublib/**'
      - 'hub/**'
      - 'vendor/**'
      - 'tests/e2e/**'
      - '.github/workflows/build.yml'   # 워크플로 수정도 빌드로 검증 — CI 핫픽스가 트리거를 못 타는 사각지대 방지
      - 'requirements*.txt'
  schedule:
    - cron: '30 22 * * 0-4'   # UTC 일~목 22:30 = KST 월~금 07:30 — 직전 거래일 종가 반영. 주말 아침 2회는 금요일과 동일 데이터라 생략
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # fetch_prices 행 방어 — 정상 빌드는 5분 이내
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Sync 수출입동향 대시보드 (실패 시 리포 내 기존 trade.html 사용)
        run: |
          curl -fsSL -o trade.new.html https://raw.githubusercontent.com/haunpapa/korea-trade-dashboard/main/korea-trade-sector-dashboard.html \
            && tail -c 30 trade.new.html | grep -q '</html>' \
            && mv trade.new.html trade.html \
            || { echo "동기화 실패 — 기존 trade.html 유지"; rm -f trade.new.html; }

      - name: Restore parse cache
        uses: actions/cache@v4
        with:
          path: build/parse_cache.json
          key: parse-cache-${{ hashFiles('reports/**/*.html', 'hublib/parse.py') }}
          restore-keys: parse-cache-

      # 가격은 매일 자라므로 내용 해시를 키로 쓸 수 없다 —
      # 매 실행마다 새로 저장하고 가장 최근 것을 복원한다. v1 은 CACHE_VERSION 과 함께 올린다.
      - name: Restore price cache (검증 레이어)
        uses: actions/cache/restore@v4
        with:
          path: build/price_cache.json
          key: price-cache-v1-${{ github.run_id }}
          restore-keys: price-cache-v1-

      # what's new 는 '전일 빌드의 요약'과 비교한다 — 가격 캐시와 같은 이유로 run_id 키 + 최근 복원.
      - name: Restore kb summary (what's new 전일 기준)
        uses: actions/cache/restore@v4
        with:
          path: build/kb_summary.json
          key: kb-summary-${{ github.run_id }}
          restore-keys: kb-summary-

      - name: Build index
        run: python build_index.py

      - name: Collect (파싱·집계·시세 — 1회만)
        env:
          MARKET_MOMENTUM_AUTO_INSTALL: "0"   # CI 는 requirements 로만 설치 — 런타임 pip 금지(누락 시 조용한 6초 설치 대신 즉시 에러 → 모멘텀 생략)
          MARKET_MOMENTUM_HISTORY_STOCKS: "40"   # 정밀 보강 복원 — SIGALRM 제거·8워커 병렬화로 이제 ~10초 (2026-09 후속 A2)
          PYTHONUNBUFFERED: "1"               # 로그 실시간 flush — 스텝 내부 구간 프로파일링 가능하게
        run: python build_hub.py --phase collect --src . --json knowledge_base.json

      # 같은 입력은 다시 묻지 않는다 — 캐시가 없으면 그날 전량 재요약(비용만 늘고 결과는 같다).
      - name: Restore AI cache (증분 요약)
        uses: actions/cache/restore@v4
        with:
          path: build/ai_cache.json
          key: ai-cache-v1-${{ github.run_id }}
          restore-keys: ai-cache-v1-

      - name: AI weekly digest (시크릿 없으면 자동 생략)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_digest.py || echo "AI 다이제스트 생략(실패 무시)"

      - name: Render (hub.html + kb.<hash>.json)
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}   # 리포 Variables 에 Pages URL — 없으면 feed.json 이 상대 URL
        run: python build_hub.py --phase render --json knowledge_base.json --out hub.html

      - name: Run tests
        # e2e 는 브라우저 설치 후 별도 스텝에서 돈다 — pytest-playwright 가 설치 단일화로 이 시점에 이미 깔려 있어,
        # 제외하지 않으면 브라우저 없는 상태에서 e2e 를 수집·실행하다 실패한다
        run: python -m pytest tests/ generator/test_parse.py -q --ignore=tests/e2e

      - name: kb 크기 예산 (경고만, 코어 2배 초과 시 실패)
        run: KB_BUDGET_CHECK=1 python -m pytest tests/test_budget.py -q

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html hub.html trade.html manifest.webmanifest sw.js _site/
          cp ai_digest.json _site/ 2>/dev/null || true
          cp feed.json _site/ 2>/dev/null || true
          cp kb.*.json _site/ 2>/dev/null || true   # 데이터/셸 분리 이후 생성됨
          cp hub.app.*.js _site/ 2>/dev/null || true   # 앱 JS 해시 파일 (C2 분리 이후 생성됨)
          cp version.json _site/
          cp -r reports icons _site/

      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      # 브라우저 리비전은 playwright 버전에 따라간다 — 버전이 캐시 키. 핀(requirements-dev.txt)으로 키가 안정된다.
      - name: Restore Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: E2E 스모크 (셸 JS — _site 기준)
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install chromium          # 캐시 히트 — 브라우저 다운로드·apt 생략
          else
            python -m playwright install --with-deps chromium
          fi
          E2E_SITE_DIR=_site python -m pytest tests/e2e -q -n 4

      # 테스트가 깨진 날에도 그날 수집분은 저장한다 — 다음 빌드의 증분 구간이 늘지 않게 (restore 와 짝).
      # hashFiles 가드: Collect 이전에 job 이 죽으면 파일이 없다 — 빈 경로 save 에러(로그 노이즈) 방지.
      - name: Save price cache
        if: always() && hashFiles('build/price_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/price_cache.json
          key: price-cache-v1-${{ github.run_id }}

      - name: Save kb summary
        if: always() && hashFiles('build/kb_summary.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/kb_summary.json
          key: kb-summary-${{ github.run_id }}

      - name: Save AI cache
        if: always() && hashFiles('build/ai_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/ai_cache.json
          key: ai-cache-v1-${{ github.run_id }}

      - name: Job Summary (kb 크기·예산·E2E 타이밍)
        if: always()
        run: |
          cat build/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ -f build/e2e_timing.json ] && { echo; echo '### E2E 타이밍'; echo '```'; cat build/e2e_timing.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
